AddonId: AutoGameSoftwareSync_Playnite_Plugin
Packages:
  - Version: 1.2.0
    RequiredApiVersion: 6.15.0
    ReleaseDate: 2026-10-29
    PackageUrl: https://github.com/Epikou/AutoGameSoftwareSync-Playnite/releases/download/v1.2.0/AutoGameSoftwareSync_Playnite_Plugin_1_2_0.pext
    Changelog:
      - Installed games list for AutoGameSoftwareSync 2.0.3 or newer, so that it can suggest the installed games you do not protect yet (games added by hand included). Written as playnite-library.json next to an existing status.json in the AGSS data folder, only when the list changes; can be switched off in the settings (the file is then removed)
      - Emulated games are listed with their ROMs and emulator (used by a later AutoGameSoftwareSync version)
      - Only items in the extension's own form (prefix followed by a state) are ever removed from your games; the prefix must have at least 4 characters and one symbol
      - Settings text and documentation now say exactly what the extension reads and writes
      - Extension icon in the add-ons list
  - Version: 1.1.0
    RequiredApiVersion: 6.15.0
    ReleaseDate: 2026-10-27
    PackageUrl: https://github.com/Epikou/AutoGameSoftwareSync-Playnite/releases/download/v1.1.0/AutoGameSoftwareSync_Playnite_Plugin_1_1_0.pext
    Changelog:
      - Badge inserted in the game page of 8 fullscreen themes (Solaris, ReskinPS5, (u)biquity, PS5ish, PlayniteModernUI, Playnite Deck, Nintendo Switch-ish, Toggle)
      - Shows the AGSS state, the last sync date and the device the version in place comes from, in its own colour
      - Genre fallback for other themes, replaced when the state changes and restored after a metadata download
      - Custom elements AGSS_Badge and AGSS_Text for theme authors
      - Texts in English, French, Russian, Spanish and Chinese
